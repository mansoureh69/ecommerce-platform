name: Backend CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Database=postgres;Username=postgres;Password=ci-ephemeral-only
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore EcommercePlatform.slnx
      - run: dotnet build EcommercePlatform.slnx -c Release --no-restore
      - run: dotnet test EcommercePlatform.slnx -c Release --no-build --logger trx --results-directory TestResults
      - run: docker build -f docker/Dockerfile -t ecommerce-platform:ci .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults
