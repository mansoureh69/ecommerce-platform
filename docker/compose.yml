name: ecommerce-platform
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["--migrate"]
    environment: &app-environment
      ConnectionStrings__Database: "Host=postgres;Database=ecommerce;Username=ecommerce;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random bytes}
      ASPNETCORE_ENVIRONMENT: Production
      Catalog__Media__Provider: Local
      Catalog__Media__LocalRoot: /app/media
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment: *app-environment
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - media-data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
  media-data:
